version: 2

# One grouped PR per ecosystem per week.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  # Gradle wrapper only. Kotlin, AGP and Compose are bumped by hand, in step
  # with gls-app-kmp: a newer Kotlin than the app's breaks its iOS klibs.
  - package-ecosystem: gradle
    directory: /packages/kotlin
    schedule:
      interval: weekly
    ignore:
      - dependency-name: 'org.jetbrains.kotlin*'
      - dependency-name: 'com.android*'
      - dependency-name: 'org.jetbrains.compose*'
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
