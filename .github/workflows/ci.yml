name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Linux is enough: Kotlin cross-compiles the iOS klibs (no cinterop), and the
    # runner ships an Android SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Compile Kotlin (Android + iOS)
        working-directory: packages/kotlin
        run: ./gradlew compileAndroidMain compileKotlinIosArm64 compileKotlinIosSimulatorArm64

