name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Linux is enough: Kotlin cross-compiles the iOS klibs (no cinterop), and the
    # runner ships an Android SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check TOKENS.md and swatches are up to date
        run: |
          if [ -n "$(git status --porcelain -- TOKENS.md docs)" ]; then
            git status --short -- TOKENS.md docs
            echo "::error::Run npm run build and commit TOKENS.md and docs/."
            exit 1
          fi
      - name: Compile Kotlin (Android + iOS)
        working-directory: packages/kotlin
        run: ./gradlew compileAndroidMain compileKotlinIosArm64 compileKotlinIosSimulatorArm64

  token-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Compare tokens with the base branch
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          git archive "origin/$GITHUB_BASE_REF" tokens | tar -x -C "$RUNNER_TEMP/base"
          node token-diff.mjs "$RUNNER_TEMP/base" . > "$RUNNER_TEMP/diff.md"
          cat "$RUNNER_TEMP/diff.md" >> "$GITHUB_STEP_SUMMARY"
      # Edits the bot's previous comment, so each PR keeps a single up-to-date summary.
      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file "$RUNNER_TEMP/diff.md" --edit-last --create-if-none
