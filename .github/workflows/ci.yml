name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Linux is enough: Kotlin cross-compiles the iOS klibs (no cinterop), and the
    # runner ships an Android SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Compile Kotlin (Android + iOS)
        working-directory: packages/kotlin
        run: ./gradlew compileAndroidMain compileKotlinIosArm64 compileKotlinIosSimulatorArm64

      # TEMP: hand the Linux-built artifacts to a local iOS link test. Remove before merge.
      - name: Publish to Maven Local
        working-directory: packages/kotlin
        run: ./gradlew publishToMavenLocal -Pversion=0.0.0-linux
      - uses: actions/upload-artifact@v4
        with:
          name: m2-linux
          path: ~/.m2/repository/com/glsnxt
