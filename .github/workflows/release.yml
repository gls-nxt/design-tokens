name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    branches: [main] # every merged PR
    tags: ['v*.*.*']

permissions:
  contents: write # tag + GitHub Release
  packages: write

# Queued runs wait, so each run sees the tags the previous one created.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Manual runs release from main; pushes release the pushed commit.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Empty = nothing to release.
      version: ${{ steps.tag.outputs.new_version || steps.pushed.outputs.version }}
    steps:
      # Tag push: the tag is the version.
      - id: pushed
        if: github.ref_type == 'tag'
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a MAJOR.MINOR.PATCH version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Merge or manual run: bump the latest tag. Commits since that tag pick the
      # bump: "!" or BREAKING CHANGE major, fix/perf patch, anything else minor.
      # A manual run's input overrides them.
      - id: tag
        if: github.ref_type != 'tag'
        uses: mathieudutour/github-tag-action@83c71bb5e316c2ffdea47a2c169498dfa9fc6afd # v7
        with:
          github_token: ${{ github.token }}
          dry_run: true # the release job tags last, after publishing
          default_bump: minor
          force_bump: ${{ inputs.bump }}

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gls-nxt'
      # Corepack runs the pnpm version pinned in package.json.
      - run: corepack enable pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Publish npm package
        working-directory: packages/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm publish

      - name: Publish Kotlin package
        working-directory: packages/kotlin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion="$VERSION"

      # Manual runs create the tag here, last, so a failed publish leaves no tag.
      # Tag pushes already have it; gh reuses the existing tag.
      # Tags created with GITHUB_TOKEN don't trigger workflows, so this never runs twice.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            --notes "$(cat <<EOF
          ## Packages
          - npm: \`@gls-nxt/design-tokens@$VERSION\`
          - Maven: \`com.glsnxt:design-tokens:$VERSION\`
          EOF
          )"
